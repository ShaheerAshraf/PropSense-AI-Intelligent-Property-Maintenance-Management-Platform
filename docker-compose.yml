version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: property_maintenance_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Local development only. Do not expose this service on a public host.
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: property_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: